[project]
name = "fsresource-tree"
dynamic = ["version"]
description = "Filesystem specialization for the generic resourcetree framework"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["resourcetree>=0.5.0"]

[tool.setuptools.dynamic]
version = { attr = "fsresourcetree.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["fsresourcetree", "fsresourcetree.*"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

name: Tests

on:
  pull_request:
  push:
    branches:
      - main
      - security/confined-filesystem-provider
  workflow_dispatch:

jobs:
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out filesystem specialization
        uses: actions/checkout@v4
        with:
          path: fsresource-tree

      - name: Check out minimum supported generic core
        uses: actions/checkout@v4
        with:
          repository: specter327/resourcetree
          ref: d605d9858b20d30971f2c40d3ae97ae27feb52c7
          path: resourcetree

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies and package
        working-directory: fsresource-tree
        run: |
          python -m pip install --upgrade pip
          python -m pip install build pytest
          python -m pip install ../resourcetree
          python -m pip install --no-deps .

      - name: Build source and wheel distributions
        working-directory: fsresource-tree
        run: python -m build --sdist --wheel

      - name: Install the built wheel
        working-directory: fsresource-tree
        run: python -c "import glob, subprocess, sys; wheels = glob.glob('dist/*.whl'); assert len(wheels) == 1, wheels; subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--no-deps', '--force-reinstall', wheels[0]])"

      - name: Run tests
        working-directory: fsresource-tree
        run: python -m pytest -q
